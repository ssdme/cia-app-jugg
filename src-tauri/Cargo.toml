[package]
name = "cia-render"
version = "1.0.2"
edition = "2021"
description = "Desktop shell and about info."
repository = "https://github.com/ssdme/cia-app-jugg"
license = "MIT"

[lib]
name = "cia_render_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
symphonia = { version = "0.5", features = ["all"] }
mp4 = "0.14"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[profile.test]
opt-level = 2

[profile.dev]
opt-level = 1
