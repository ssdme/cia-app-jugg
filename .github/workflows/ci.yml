name: verify

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run verify:payload
      - run: npm run test:media
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # CI installers are test artifacts; never generate an unrelated updater key.
      - run: npm run tauri build -- --config src-tauri/tauri.ci.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: cia-render-nsis-test-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
